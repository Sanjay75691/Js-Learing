<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Event</title>
</head>
<style>
    .itemA {
        color: red;
    }
    .itemB {
        color: blue;
    }
    .itemC {
        color: green;
    }
    .itemD {
        color: orange;
    }
</style>
<body>
    <ul id="main">
        <li class="itemA"><img src="red-image.jpg" alt="Red Item"></li>
        <li class="itemB"><img src="blue-image.jpg" alt="Blue Item"></li>
        <li class="itemC"><img src="green-image.jpg" alt="Green Item"></li>
        <li class="itemD"><img src="orange-image.jpg" alt="Orange Item"></li>
    </ul>
</body>
<script>
    <!-- Clicked Event LIstener-->
    document.getElementsByClassName('itemA')[0].addEventListener('click', function() {
        alert('Item Red Clicked')
    })
    document.getElementsByClassName('itemB')[0].addEventListener('click', function() {
        alert('Item Blue Clicked')
    })
    document.getElementsByClassName('itemC')[0].addEventListener('click', function() {
        alert('Item Green Clicked')
    })
    document.querySelector('.itemD').addEventListener('click', function() {
        alert('Item Orange Clicked')
    })
    
        <!--Event remove-->
    document.getElementById('main').addEventListener('click', function(e) {
        console.log(e.target.parentNode)
        let li = e.target.parentNode
        li.remove()
    })
</script>
</html>
