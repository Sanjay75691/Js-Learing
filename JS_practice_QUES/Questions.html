    // 2. Sum of Two Numbers
    function add(a, b) {

    // 3. Square of a Number
    function square(num){
        return num*num;
    }
    console.log(square(6));

    // 3. oddEven Number
    function EvenOrOdd(num) {
        if (num % 2 === 0) {
            return 'Even';
        }
        return 'Odd';
    }
    console.log(EvenOrOdd(9));

    // 5. Find the Largest Number
    function largeNum(a, b) {
      if (a > b) {
        return "a";
      }
      return "b";
    }
    console.log(largeNum(30, 20))

//   ✅  n0.6

  function celsiusToFahrenheit(celsius) {
  return (celsius * 9) / 5 + 32;
}

console.log(celsiusToFahrenheit(0));    // 32

// ✅ Question 8: Check Positive, Negative, or Zero
  function checkNumber(num) {
  if (num > 0) {
    return "positive";
  }
  else if (num < 0) {
    return "negative";
  }
  else  {
    return "Zero";
  }

  }
  console.log(checkNumber(-6))

  // 🎯 Question 9: Factorial of a Number
function factorial(num) {
  let result = 1;

  for (let i = 1; i <= num; i++) {
    result = result * i;
  }

  return result;
}

console.log(factorial(5));
